networks:
  wud-net:
    driver: bridge
  caddy-proxy:
    external: true

secrets:
  lscr-private-username:
    file: ./secrets/lscr-private-username
  lscr-private-token:
    file: ./secrets/lscr-private-token

services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: wud-socket-proxy
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:2375/_ping || exit 1
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 10s
      start_interval: 1s
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      TZ: ${TZ:-Etc/UTC}
    labels:
      wud.tag.include: latest
      wud.watch.digest: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wud-net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run

  whatsupdocker:
    image: ghcr.io/getwud/wud:9.0.2
    container_name: wud
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      WUD_AUTH_OIDC_AUTHENTIK_CLIENTID: ${AUTHENTIK_CLIENT_ID:?AUTHENTIK_CLIENT_ID is not set}
      WUD_AUTH_OIDC_AUTHENTIK_CLIENTSECRET: ${AUTHENTIK_CLIENT_SECRET:?AUTHENTIK_CLIENT_SECRET is not set}
      WUD_AUTH_OIDC_AUTHENTIK_DISCOVERY: https://auth.${BASE_DOMAIN:?BASE_DOMAIN is not set}/application/o/wud/.well-known/openid-configuration
      WUD_AUTH_OIDC_AUTHENTIK_REDIRECT: true
      WUD_AUTH_OIDC_AUTHENTIK_GROUPSCLAIM: groups
      WUD_AUTH_OIDC_AUTHENTIK_ADMINGROUP: Monitoring Admins
      WUD_AUTH_OIDC_AUTHENTIK_RWGROUP: Monitoring Managers
      WUD_AUTH_OIDC_AUTHENTIK_ROGROUP: Monitoring
      # not all OIDC users have email
      WUD_AUTH_OIDC_AUTHENTIK_USERNAMECLAIM: preferred_username
      # configured automatically based on the envvars above
      # WUD_AUTH_OIDC_AUTHENTIK_SCOPE: "openid email profile groups"

      WUD_REGISTRY_LSCR_PUBLIC_USERNAME__FILE: /run/secrets/lscr-private-username
      WUD_REGISTRY_LSCR_PUBLIC_TOKEN__FILE: /run/secrets/lscr-private-token

      WUD_TRIGGER_HTTP_N8N_URL: ${N8N_WEBHOOK_URL:?N8N_WEBHOOK_URL is not set}

      WUD_WATCHER_FANGBOX_HOST: wud-socket-proxy
      WUD_WATCHER_FANGBOX_PORT: 2375
      WUD_WATCHER_FANGBOX_SOCKET: tcp://wud-socket-proxy
      WUD_WATCHER_FANGBOX_CRON: '0 */8 * * *'

      WUD_WATCHER_BBG_HOST: ${BBG_HOST:?BBG_HOST is not set}
      WUD_WATCHER_BBG_PORT: 2375
      WUD_WATCHER_BBG_CRON: '0 */8 * * *'
    labels:
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/getwud/wud/releases/tag/$${major}.$${minor}.$${patch}'
    networks:
      - caddy-proxy
      - wud-net
    ports:
      - "2300:3000"
    secrets:
      - lscr-private-token
      - lscr-private-username
