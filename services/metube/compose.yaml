networks:
  caddy-proxy:
    external: true

services:
  metube:
    image: ghcr.io/alexta69/metube:2026.04.03
    container_name: metube
    restart: unless-stopped
    environment:
      YTDL_OPTIONS: '{"cookiefile":"/cookies/cookies.txt"}'
    networks:
      - caddy-proxy
    ports:
      - "8081:8081"
    labels:
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      # this is just a JS string template so JS functions work as expected
      wud.link.template: 'https://github.com/alexta69/metube/releases/tag/$${major}.$${minor.toString().padStart(2, "0")}.$${patch.toString().padStart(2, "0")}'
    volumes:
      - ${DOWNLOADS_DIR:?DOWNLOADS_DIR is not set}:/downloads
      - ${COOKIES_FILE:?COOKIES_FILE is not set}:/cookies/cookies.txt
