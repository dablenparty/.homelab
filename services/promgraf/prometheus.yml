global:
  scrape_interval: 15s

  external_labels:
    instance: 'couchlab'

scrape_configs:
  - job_name: caddy
    static_configs:
      - targets: ['caddy:2019']

  - job_name: cAdvisor
    metric_relabel_configs:
      - source_labels: ['container_label_com_docker_swarm_service_name']
        target_label: 'service'
      - source_labels: ['name']
        target_label: 'container'
    static_configs:
      - targets: ['cadvisor:8080', 'bbg.internal:8080']

  - job_name: minecraft
    scheme: http
    static_configs:
      - targets: ['bbg.internal:19565']
        labels:
          application: 'tekxit'
          instance: tekxit

  - job_name: pihole
    static_configs:
      - targets: ['pihole6-exporter:9666']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: wud
    static_configs:
      - targets: ['wud:3000']

  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9100', 'white-lotus.internal:9100', 'bbg.internal:9100']

