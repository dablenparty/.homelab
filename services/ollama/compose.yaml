x-ollama: &base-ollama
  image: ollama/ollama:0.32.4
  user: ${OLLAMA_UID:-1000}:${OLLAMA_GID:-1000}
  devices:
    - /dev/nvidia-caps:/dev/nvidia-caps
    - /dev/nvidia0:/dev/nvidia0
    - /dev/nvidiactl:/dev/nvidiactl
    - /dev/nvidia-modeset:/dev/nvidia-modeset
    - /dev/nvidia-uvm:/dev/nvidia-uvm
    - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
  runtime: nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  volumes:
    - ${OLLAMA_DATA_DIR:?OLLAMA_DATA_DIR is not set}:/.ollama

networks:
  caddy-proxy:
    external: true
  # for other containers that want to use ollama
  ollama-net:
    driver: bridge
    name: ollama-net

services:
  ollama:
    <<: *base-ollama
    tty: true
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    healthcheck:
      test: ollama --version && ollama ps || exit 1
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 1s
    environment:
      # NOTE: disable cgroups on docker daemon for this to work
      OLLAMA_KEEP_ALIVE: 5m
      # OLLAMA_KEEP_ALIVE: -1m
    networks:
      - ollama-net
    ports:
      - "127.0.0.1:11434:11434"
    labels:
      wud.tag.include: '^\d+\.\d+\.\d+$$'
      wud.link.template: 'https://github.com/ollama/ollama/releases/tag/v$${major}.$${minor}.$${patch}'

  init-ollama:
    <<: *base-ollama
    network_mode: service:ollama
    depends_on:
      ollama:
        condition: service_healthy
        restart: true
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: /usr/bin/env bash
    command:
      - "-c"
      - |
        sleep 3
        IFS=$$',' read -ra models <<<"${MODEL_LIST:?MODEL_LIST is not defined}"
        for model in "$${models[@]}"; do ollama pull "$$model"; done
    labels:
      wud.watch: false

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2-slim
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    # ports:
    #   - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      # Disables user/password login form. Required when ENABLE_OAUTH_SIGNUP: true.
      ENABLE_LOGIN_FORM: false
      ENABLE_OAUTH_ROLE_MANAGEMENT: true
      # Allows auto-creation of new users using OAuth. Must be paired with ENABLE_LOGIN_FORM: false.
      ENABLE_OAUTH_SIGNUP: true
      ENABLE_RAG_WEB_SEARCH: true
      ENABLE_WEB_SEARCH: True
      OAUTH_CLIENT_ID: ${OID_CLIENT_ID:?OID_CLIENT_ID is not set}
      OAUTH_CLIENT_SECRET: ${OID_CLIENT_SECRET:?OID_CLIENT_SECRET is not set}
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
      OAUTH_PROVIDER_NAME: ${OID_PROVIDER:-authentik}
      OLLAMA_BASE_URL: http://ollama:11434
      OAUTH_SCOPES: "openid email profile roles"
      OPENID_PROVIDER_URL: https://auth.${BASE_DOMAIN:?BASE_DOMAIN is not set}/application/o/open-webui/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://open-webui.${BASE_DOMAIN:?BASE_DOMAIN is not set}/oauth/oidc/callback
      RAG_WEB_SEARCH_CONCURRENT_REQUESTS: 10
      RAG_WEB_SEARCH_ENGINE: "searxng"
      RAG_WEB_SEARCH_RESULT_COUNT: 4
      # SEARXNG_QUERY_URL: "https://searxng.${BASE_DOMAIN:?BASE_DOMAIN is not set}/search?q=<query>"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      WEBUI_URL: https://open-webui.${BASE_DOMAIN:?BASE_DOMAIN is not set}
      WEB_SEARCH_CONCURRENT_REQUESTS: 10
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: 4
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - caddy-proxy
      - ollama-net
    volumes:
      - ${OPEN_WEBUI_DATA_DIR:?OPEN_WEBUI_DATA_DIR is not set}:/app/backend/data
    labels:
      wud.tag.include: '^v\d+\.\d+\.\d+(-slim)?$$'
      wud.tag.transform: '^(v\d+\.\d+\.\d+)(-slim)?$$ => $$1'
      wud.link.template: 'https://github.com/open-webui/open-webui/releases/tag/v$${major}.$${minor}.$${patch}'


